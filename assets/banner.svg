ce 4s ease-in-out infinite 2s}.stage-anim-4{animation:dealBounce 4s ease-in-out infinite 3s}.badge-pulse{animation:badgePulse 3s infinite ease-in-out}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="220" cy="80" r="140" fill="#38bdf8" class="orb-anim" filter="url(#glow)"/><circle cx="1020" cy="300" r="160" fill="#a855f7" class="orb-anim" filter="url(#glow)" style="animation-delay:-3s"/><circle cx="600" cy="380" r="110" fill="#3b82f6" class="orb-anim" filter="url(#glow)" style="animation-delay:-5s"/><rect width="1200" height="4" x="0" y="0" fill="url(#accentGrad)"/><g id="pipeline-stages"><path fill="none" stroke="#475569" stroke-width="2" d="M 120 45 L 370 45 L 620 45 L 870 45" opacity=".6" transform="translate(60, 260)"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2.5" d="M 120 45 L 370 45 L 620 45 L 870 45" class="flow-line" transform="translate(60, 260)"/><g class="stage-anim-1" transform="translate(60, 260) translate(10, 0)"><rect width="210" height="90" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="25" cy="25" r="7" fill="#38bdf8" filter="url(#softGlow)"/><text x="42" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STAGE 01</text><text x="25" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Lead Generation</text><text x="25" y="73" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">42 Inbound Leads • $184K</text></g><g class="stage-anim-2" transform="translate(60, 260) translate(260, 0)"><rect width="210" height="90" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="25" cy="25" r="7" fill="#818cf8" filter="url(#so