<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .stage-card {
      transition: all 0.5s ease;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.45; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dealBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.8)); }
    }
    .orb-anim {
      animation: pulseOrb 8s infinite ease-in-out;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowLine 12s linear infinite;
    }
    .stage-anim-1 { animation: dealBounce 4s ease-in-out infinite; }
    .stage-anim-2 { animation: dealBounce 4s ease-in-out infinite 1s; }
    .stage-anim-3 { animation: dealBounce 4s ease-in-out infinite 2s; }
    .stage-anim-4 { animation: dealBounce 4s ease-in-out infinite 3s; }
    .badge-pulse { animation: badgePulse 3s infinite ease-in-out; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Glow Lights (Deep Background) -->
  <circle cx="220" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-anim" />
  <circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glow)" class="orb-anim" style="animation-delay: -3s;" />
  <circle cx="600" cy="380" r="110" fill="#3b82f6" filter="url(#glow)" class="orb-anim" style="animation-delay: -5s;" />

  <!-- Top Decorative Border Accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Dynamic Pipeline Stages / Flow Visuals in Background & Midground (Y: 260 to 390) -->
  <g id="pipeline-stages" transform="translate(60, 260)">
    <!-- Connecting Flow Path -->
    <path d="M 120 45 L 370 45 L 620 45 L 870 45" fill="none" stroke="#475569" stroke-width="2" opacity="0.6" />
    <path d="M 120 45 L 370 45 L 620 45 L 870 45" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" class="flow-line" />

    <!-- Stage 1: Lead Capture -->
    <g class="stage-anim-1" transform="translate(10, 0)">
      <rect width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="25" r="7" fill="#38bdf8" filter="url(#softGlow)" />
      <text x="42" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STAGE 01</text>
      <text x="25" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Lead Generation</text>
      <text x="25" y="73" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">42 Inbound Leads • $184K</text>
    </g>

    <!-- Stage 2: Qualification -->
    <g class="stage-anim-2" transform="translate(260, 0)">
      <rect width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="25" r="7" fill="#818cf8" filter="url(#softGlow)" />
      <text x="42" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STAGE 02</text>
      <text x="25" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Discovery &amp; Demo</text>
      <text x="25" y="73" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">24 Active Trials • $320K</text>
    </g>

    <!-- Stage 3: Negotiation -->
    <g class="stage-anim-3" transform="translate(510, 0)">
      <rect width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="25" r="7" fill="#c084fc" filter="url(#softGlow)" />
      <text x="42" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STAGE 03</text>
      <text x="25" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Proposal &amp; Value</text>
      <text x="25" y="73" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">11 Reviewing • $510K</text>
    </g>

    <!-- Stage 4: Closed Won -->
    <g class="stage-anim-4" transform="translate(760, 0)">
      <rect width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" filter="url(#softGlow)" stroke-opacity="0.7" />
      <circle cx="25" cy="25" r="7" fill="#10b981" filter="url(#softGlow)" />
      <text x="42" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STAGE 04</text>
      <text x="25" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Closed Won 🏆</text>
      <text x="25" y="73" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">8 Closed • $285K ARR</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed never overlapped -->
  <g id="foreground-hero" transform="translate(60, 50)">
    <!-- Pill Badge -->
    <g class="badge-pulse">
      <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="28" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED REVENUE &amp; CRM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Sales Pipeline &amp; Deal Tracking
    </text>

    <!-- Subtitle -->
    <text x="0" y="126" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Visual Kanban Pipelines • Multi-Tenant Open Source CRMs • Revenue Forecasting &amp; Deal Intelligence
    </text>

    <!-- Metadata Badges -->
    <g transform="translate(0, 150)">
      <!-- Badge 1 -->
      <rect width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">⚡ Commercial SaaS</text>

      <!-- Badge 2 -->
      <rect x="155" width="160" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="167" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">💻 Self-Hosted Open Source</text>

      <!-- Badge 3 -->
      <rect x="325" width="165" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="337" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">📊 Pricing &amp; Market Insights</text>
    </g>
  </g>
</svg>
